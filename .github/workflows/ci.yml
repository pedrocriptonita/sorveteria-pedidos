name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      # Instalação reprodutível a partir do package-lock.json (commitado).
      - name: Install
        run: npm ci --no-audit --no-fund

      # `prisma generate` não conecta ao banco e não precisa de .env.local —
      # roda direto (o script db:generate usa dotenv-cli, que falha no CI).
      - name: Prisma generate
        run: npx prisma generate

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
        env:
          # Build não conecta ao banco; valor fictício só p/ satisfazer env().
          DATABASE_URL: "postgresql://user:pass@localhost:5432/db"
          DIRECT_URL: "postgresql://user:pass@localhost:5432/db"
